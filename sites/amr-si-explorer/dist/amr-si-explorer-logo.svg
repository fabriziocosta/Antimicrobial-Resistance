<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none" role="img" aria-labelledby="logo-title logo-description">
  <title id="logo-title">AMR SI Explorer</title>
  <desc id="logo-description">The original bacterium and resistance shield artwork, placed over a geometric globe.</desc>
  <defs>
    <clipPath id="globe"><circle cx="128" cy="128" r="108"/></clipPath>
    <mask id="bacterium-clearance" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <rect width="256" height="256" fill="white"/>
      <rect x="95" y="68" width="66" height="119" rx="33" fill="black"/>
    </mask>
  </defs>
  <!-- Geometric globe, drawn behind the preserved artwork. -->
  <circle cx="128" cy="128" r="108" stroke="#132a43" stroke-width="9.3"/>
  <g clip-path="url(#globe)" mask="url(#bacterium-clearance)" stroke="#132a43" stroke-width="3.2">
    <ellipse cx="128" cy="128" rx="108" ry="47"/>
    <ellipse cx="128" cy="128" rx="58" ry="108"/>
  </g>
  <!-- A matching-color underlay keeps globe lines behind the original transparent shield. -->
  <path d="M180 108l18-6 18 6-2 20c-2 12-7 20-16 27-9-7-14-15-16-27z" fill="#f7f9fc"/>
  <image href="./amr-bacterium-shield.png" x="0" y="0" width="256" height="256"/>
</svg>
